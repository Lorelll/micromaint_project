<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель керування</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
    </script>
    <style>
        .admin-grid { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 32px; align-items: start; }
        @media(max-width: 850px) { .admin-grid { grid-template-columns: 1fr; } }
        h2 { margin: 0 0 24px 0; font-weight: 500; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        textarea { height: 110px; resize: vertical; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn-primary { flex: 1; text-align: center; }
        .btn-secondary { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); padding: 12px 24px; }
        .navbar-float { position: absolute; top: 16px; right: 24px; }
    </style>
</head>
<body>
    <div class="navbar-float">
        <button id="theme-toggle" class="theme-toggle-btn" title="Перемкнути тему">
            <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
        </button>
    </div>

    <div class="admin-grid">
        <div class="expressive-card">
            <h2>
                <span class="material-symbols-outlined" style="color: var(--md-primary)">assignment</span>
                Нове завдання календарного ТО
            </h2>
            <form action="{{ url_for('add_task') }}" method="POST">
                <div class="form-group">
                    <label>Виберіть пристрій / обладнання із наявних</label>
                    <select name="device_id" required>
                        {% for device in devices %}
                            <option value="{{ device['id'] }}">{{ device['name'] }} — {{ device['location'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Назва регламентної роботи</label>
                    <input type="text" name="title" required placeholder="Наприклад: Щомісячна заміна фільтрів">
                </div>
                <div class="form-group">
                    <label>Планова дата виконання</label>
                    <input type="date" name="planned_date" required>
                </div>
                <div class="form-group">
                    <label>Пункти експрес чек-ліста (кожен пункт з нового рядка)</label>
                    <textarea name="checklist_items" required placeholder="Очищення робочих поверхонь&#10;Оновлення ПЗ модуля&#10;Перевірка контуру заземлення"></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Зберегти та призначити</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">До календаря</a>
                </div>
            </form>
        </div>

        <div class="expressive-card" style="border: 1px dashed var(--md-outline);">
            <h2>
                <span class="material-symbols-outlined" style="color: var(--md-primary)">add_location_alt</span>
                Реєстрація обладнання
            </h2>
            <form action="{{ url_for('add_device') }}" method="POST">
                <div class="form-group">
                    <label>Назва пристрою / Модель</label>
                    <input type="text" name="device_name" required placeholder="Наприклад: Термінал #45">
                </div>
                <div class="form-group">
                    <label>Локація / Адреса об'єкта</label>
                    <input type="text" name="location" required placeholder="Наприклад: пр. Соборний, 102">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--md-primary-container); color: var(--md-on-primary-container);">
                    <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">playlist_add</span>
                    Внести в базу даних
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            themeIcon.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light_mode' : 'dark_mode';

            toggleBtn.addEventListener('click', () => {
                let theme = document.documentElement.getAttribute('data-theme');
                let newTheme = theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? 'light_mode' : 'dark_mode';
            });
        });
    </script>
</body>
</html>
